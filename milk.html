<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cow Feed</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#2e7d32;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:30px auto;
            display:flex;
            justify-content:space-around;
            flex-wrap:wrap;
            gap:20px;
        }

        .card{
            background:white;
            width:300px;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 3px 10px rgba(0,0,0,0.2);
            text-align:center;
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card h2{
            margin:15px 0;
            color:#2e7d32;
        }

        .card p{
            padding:0 15px 15px;
            color:#555;
        }

        .btn{
            display:inline-block;
            margin-bottom:20px;
            padding:10px 20px;
            background:#2e7d32;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#1b5e20;
        }
    </style>
</head>

<body>

<header>
    <h1>miking machine</h1>
    <p>High Quality Feed for Healthy Cows</p>
</header>

<div class="container">

    <div class="card">
        <img src="image/Milk3Litre.jpeg" alt="Three Litre Machine">
        <h2> 3 liter</h2>
        <p> life made easy</p>
        <a href="gold.html" class="btn">buy button</a>
    </div>

    <div class="card">
        <img src="image/Milk2Litre.jpeg" alt="two litre Machine">
        <h2>2 liter</h2>
        <p>this is used for few cows</p>
        <a href="silver.html" class="btn">buy button</a>
    </div>

    <div class="card">
        <img src="image/normal.jpg" alt="">
        <h23lither</h2>
        <p>.</p>
        <a href="normal.html" class="btn">buy button</a>
    </div>

</div>

</body>
</html>
